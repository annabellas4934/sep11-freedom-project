<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime.js Quickstart</title>
    <style>
        .square {
            width: 100px;
            height: 100px;
            background-color: #3498db;
            margin: 50px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="square"></div>

    <!-- 1. Load the Library -->
    <script src="node_modules/animejs/dist/bundles/anime.esm.js"></script>

    <!-- 2. Run the Animation -->
    <script>
        anime({
            targets: '.square',
            translateX: 250,
            rotateZ: 360,
            duration: 2000,
            loop: true,
        });
    </script>
</body>
</html>
