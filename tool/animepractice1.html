<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime.js Quickstart</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: #3498db;
            margin: 50px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="box"></div>

    <!-- 1. Load the Library -->
    <script src="https://cloudflare.com"></script>

    <!-- 2. Run the Animation -->
    <script>
        anime({
            targets: '.box',
            translateX: 250,
            rotate: '1turn',
            backgroundColor: '#e74c3c',
            duration: 2000,
            loop: true,
            direction: 'alternate',
            easing: 'easeInOutSine'
        });
    </script>
</body>
</html>
